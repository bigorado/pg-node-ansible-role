---
galaxy_info:
  role_name: pg_node
  namespace: pasarguard
  author: PasarGuard Node role maintainers
  description: >-
    Install PasarGuard Node on Linux (docker compose or native systemd service),
    generate the node TLS certificate, install Xray geodata, and optionally
    register the node in PasarGuard via the Admin API.
  license: MIT
  min_ansible_version: "2.15"

  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bookworm

  galaxy_tags:
    - pasarguard
    - xray
    - proxy
    - vpn
    - node
    - docker
    - systemd

dependencies: []
